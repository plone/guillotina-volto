version: '3'
services:
  guillotina:
    build: .
    image: guillotina_volto:local
    ports:
      - '8081:8080'
    volumes:
      - .:/usr/src/app
      - ./config-dockercompose.yaml:/usr/src/app/config-dockercompose.yaml:ro
      - logvolume01:/var/log
    command: ["guillotina", "-c", "config-dockercompose.yaml"]
    links:
      - postgres
  guillotina-local:
    build: .
    image: guillotina_volto:local
    expose:
      - '8080'
    volumes:
      - .:/usr/src/app
      - ../guillotina:/usr/src/guillotina
      - logvolume01:/var/log
    links:
      - postgres
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - guillotina
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  postgres:
    image: postgres:15
    container_name: gcms_dev_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: guillotina
    ports:
      - '5434:5432'
    volumes:
      - postgres_data_cms:/var/lib/postgresql/data

volumes:
  logvolume01: {}server {
    listen 80;
    server_name _;

    # Forward all requests to the "guillotina" service on port 8080
    location / {
        proxy_pass         http://guillotina:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }
}

  postgres_data_cms: {}
